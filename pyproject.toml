[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gutsrun"
version = "0.0.1"
description = "Run Python calls as cluster tasks behind a standard Executor (GUTS Fast Track)"
requires-python = ">=3.12"

[project.scripts]
gutsrun-infretis = "gutsrun_infretis.chain:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Copied from infentory unchanged (PROVENANCE.md).
extend-exclude = ["examples"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade, type annotations
select = ["F", "E", "W", "I", "B", "UP", "ANN"]
# Any is the honest type for calls passed through (*args, **kwargs).
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Test functions and fixtures: annotations would add nothing for a reader.
"tests/test_*.py" = ["ANN"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
include = ["src", "tests", "bench"]
extraPaths = ["src", "tests", "bench"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: minutes-long real-MD checks; run with `pytest -m slow`",
    "hq: needs the hq binary and the HyperQueue client (run inside `nix develop`)",
]
