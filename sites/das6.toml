# DAS-6, VU cluster (login node fs0). Site knobs for the all-in-one sbatch
# (Fast Track step 7). Measured facts behind these values: vault note
# notes/2026-10-16-das-6-compute-nodes-and-home-nfs.md.

[slurm]
partition = "defq"
max_walltime_day = "00:15:00"   # DAS-6 policy 08:00-20:00; Slurm itself sets no limit
max_nodes_day = 2               # our own rule for daytime jobs
cpus_per_node = 48              # Slurm's count: 24 cores x 2 SMT
cores_per_node = 24
exclusive = true
needs_module = []               # no `module load prun` needed
# Never pass --mem: Slurm has no memory configured.

[python]
interpreter = "/usr/bin/python3.12"   # on fs0 and the compute nodes
venv = "~/infretis_hyperqueue/.venv"  # built on fs0, on /home (NFS)
# Run a copy unpacked from bin/venv.tar to local_disk at job start
# (plan decision 15); call everything as `python -m`.
local_venv = true

[paths]
repo = "~/infretis_hyperqueue"
runs = "~/infretis_hyperqueue/runs/das6"
scratch = "/var/scratch/$USER"     # shared
local_disk = "/local"                 # node-local NVMe

[fs]
# How to wait for another node's file on /home: list the directory. Retrying
# open() on a not-yet-existing name can miss it for 30 s or more (NFS).
watch = "listdir"

[engines]
# Not provided by DAS-6. Engines come the way researchers get theirs.
gromacs = "TBD"
lammps = "TBD"
