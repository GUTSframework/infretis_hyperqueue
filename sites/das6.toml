# DAS-6, VU cluster (login node fs0). What each key means, and the other
# values it takes: sites/template.toml. The facts behind these values:
# ASSUMPTIONS.md.

[slurm]
# defq is DAS-6's default partition: 32 CPU nodes.
partition = "defq"
# Slurm reports 48 CPUs: 24 cores with two hardware threads each.
cores_per_node = 24
# DAS-6 policy for 08:00-20:00; Slurm itself sets no limit.
max_walltime = "00:15:00"
# (Never pass --mem on DAS-6: Slurm has no memory configured.)

[environment]
# DAS-6 provides no MD engines; scripts/das6/install-engines.sh installs
# conda-forge GROMACS and LAMMPS in /var/scratch. Only their gmx and lmp
# are put on PATH, not the conda env's python3. The CUDA build
# (install-gromacs-gpu.sh) needs libcuda, which the GPU nodes keep outside
# the linker's search path, in the directory of the driver they run.
setup = '''
export PATH="/var/scratch/$USER/miniforge3/md-bin:$PATH"
export LD_LIBRARY_PATH="/cm/local/apps/cuda-driver/libs/current/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
'''
